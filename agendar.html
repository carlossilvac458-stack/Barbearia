<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar horário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#14110f;--bg2:#1e1a17;--line:#3a322b;--gold:#e0b060;--text:#f4efe6;--muted:#cfc6b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 20px 60px}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:44px;line-height:1;margin:8px 0 4px;color:var(--gold);letter-spacing:1px}
h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:26px;margin:28px 0 10px;letter-spacing:1px}
p.sub{margin:0;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{min-height:48px;padding:0 18px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:16px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.opt:focus-visible,.go:focus-visible,input:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.opt small{display:block;color:inherit;opacity:.75;font-size:13px}
input{width:100%;min-height:48px;padding:0 14px;margin-bottom:10px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:16px}
.go{width:100%;min-height:56px;margin-top:12px;background:var(--gold);color:var(--bg);border:0;border-radius:4px;font:inherit;font-weight:600;font-size:18px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.hint{color:#a89f92;font-size:14px;margin-top:10px}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1 id="nome"></h1>
<p class="sub">Escolha o barbeiro, o serviço e o horário. Seu pedido chega no WhatsApp da barbearia.</p>

<h2>Barbeiro</h2><div class="opts" id="barbers"></div>
<h2>Serviço</h2><div class="opts" id="services"></div>
<h2>Dia</h2><div class="opts" id="days"></div>
<h2>Horário</h2><div class="opts" id="times"><span class="empty">Escolha o dia primeiro.</span></div>
<h2>Seus dados</h2>
<label for="cli" class="sub">Seu nome</label>
<input id="cli" autocomplete="name">
<button class="go" id="send" disabled>Pedir horário pelo WhatsApp</button>
<p class="hint">A barbearia confirma o horário respondendo sua mensagem.</p>
</main>
<script>
/* ===== CONFIGURE AQUI PARA CADA BARBEARIA ===== */
const CONFIG = {
  nome: "Barbearia Exemplo",
  whatsapp: "5521998319980",          // DDI + DDD + número, só números
  barbeiros: ["Carlos", "João"],
  servicos: [
    {nome: "Corte", preco: "R$ 40"},
    {nome: "Barba", preco: "R$ 30"},
    {nome: "Corte + barba", preco: "R$ 60"}
  ],
  abre: 9, fecha: 19, intervaloMin: 30,
  diasFechados: [0],                   // 0 = domingo
  diasNaFrente: 14
};
/* =============================================== */
const S = {barber: null, service: null, day: null, time: null};
const $ = id => document.getElementById(id);
$("nome").textContent = CONFIG.nome;
document.title = "Agendar | " + CONFIG.nome;
const WD = ["dom","seg","ter","qua","qui","sex","sáb"];
const pad = n => String(n).padStart(2, "0");

function chips(el, items, key, label) {
  el.textContent = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.setAttribute("aria-pressed", "false");
    label(b, it);
    b.onclick = () => {
      S[key] = it;
      [...el.children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
      if (key === "day") { S.time = null; renderTimes(); }
      update();
    };
    el.appendChild(b);
  });
}
function txt(b, a, s) {
  b.textContent = a;
  if (s) { const m = document.createElement("small"); m.textContent = s; b.appendChild(m); }
}
chips($("barbers"), CONFIG.barbeiros, "barber", (b, i) => txt(b, i));
chips($("services"), CONFIG.servicos, "service", (b, i) => txt(b, i.nome, i.preco));

const days = [];
for (let i = 0; days.length < CONFIG.diasNaFrente; i++) {
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + i);
  if (!CONFIG.diasFechados.includes(d.getDay())) days.push(d);
}
chips($("days"), days, "day", (b, d) => txt(b, WD[d.getDay()] + " " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1)));

function renderTimes() {
  const now = new Date(), slots = [];
  for (let m = CONFIG.abre * 60; m < CONFIG.fecha * 60; m += CONFIG.intervaloMin) {
    const t = new Date(S.day); t.setHours(0, m, 0, 0);
    if (t > now) slots.push(pad(Math.floor(m / 60)) + ":" + pad(m % 60));
  }
  if (!slots.length) { $("times").innerHTML = '<span class="empty">Sem horários neste dia. Escolha outro.</span>'; return; }
  chips($("times"), slots, "time", (b, t) => txt(b, t));
}
function update() {
  $("send").disabled = !(S.barber && S.service && S.day && S.time && $("cli").value.trim());
}
$("cli").addEventListener("input", update);
$("send").onclick = () => {
  const d = S.day, data = WD[d.getDay()] + " " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1);
  const msg = "Olá! Quero agendar na " + CONFIG.nome + ":\n" +
    "Nome: " + $("cli").value.trim() + "\n" +
    "Barbeiro: " + S.barber + "\n" +
    "Serviço: " + S.service.nome + " (" + S.service.preco + ")\n" +
    "Dia: " + data + "\n" +
    "Horário: " + S.time + "\nPode confirmar?";
  window.location.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg);
};
</script>
</body>
</html>
